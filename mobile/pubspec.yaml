name: stoptify
description: >
  Stoptify — an AI-powered mastery learning platform that eliminates
  "tutorial hell" via prerequisite-locked roadmaps, explicit anti-scope
  boundaries, and an 80% Feynman oral-defense exit gate.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Storage (JWT persistence)
  flutter_secure_storage: ^9.2.2

  # Styling
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

  # Animation
  flutter_animate: ^4.5.0

  # Markdown (AI textbook chapters)
  flutter_markdown: ^0.7.3

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0
  file_picker: ^10.3.8
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
